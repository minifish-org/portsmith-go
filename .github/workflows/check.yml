name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test without model credentials
        run: go test -mod=readonly -count=1 -timeout=0 ./...
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Test release tooling
        run: go test -mod=readonly ./scripts/release.go ./scripts/release_test.go
      - name: Build and smoke test
        run: |
          go build -mod=readonly -trimpath -o bin/portsmith ./cmd/portsmith
          ./bin/portsmith --help
